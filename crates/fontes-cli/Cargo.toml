[package]
name = "fontes-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for fontes development and inspection"

[[bin]]
name = "fontes"
path = "src/main.rs"

[dependencies]
fontes-core = { path = "../fontes-core" }
fontes-tui = { path = "../fontes-tui" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
zip = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
