[package]
name = "fontes-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal Bible study UI for fontes"

[lib]
name = "fontes_tui"
path = "src/lib.rs"

[[bin]]
name = "fontes-tui"
path = "src/main.rs"

[dependencies]
fontes-core = { path = "../fontes-core" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
clap = { version = "4.5", features = ["derive", "env"] }
pulldown-cmark = "0.13"
tui-textarea = { version = "0.7", default-features = false, features = ["search", "crossterm"] }
